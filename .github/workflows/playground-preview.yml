name: WordPress Playground PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: WordPress/action-wp-playground-pr-preview@v3
        with:
          blueprint: |
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              "landingPage": "/?pagename=cim-diagnostic",
              "preferredVersions": {
                "php": "7.4",
                "wp": "6.5"
              },
              "steps": [
                {
                  "step": "installPlugin",
                  "pluginData": {
                    "resource": "git:directory",
                    "url": "https://github.com/${{ github.repository }}.git",
                    "ref": "${{ github.event.pull_request.head.ref }}",
                    "path": "/"
                  },
                  "options": {
                    "activate": true
                  }
                },
                {
                  "step": "runPHP",
                  "code": "<?php\nrequire_once '/wordpress/wp-load.php';\n\n$page = get_page_by_path( 'cim-diagnostic', OBJECT, 'page' );\n$post = array(\n    'post_title'   => 'Code in Motion Diagnostic',\n    'post_name'    => 'cim-diagnostic',\n    'post_type'    => 'page',\n    'post_status'  => 'publish',\n    'post_content' => '[cim experience=\\\"synthetic-wordpress\\\"]CiM diagnostic fallback.[/cim]'\n);\n\nif ( $page ) {\n    $post['ID'] = $page->ID;\n}\n\n$result = wp_insert_post( $post, true );\nif ( is_wp_error( $result ) ) {\n    throw new RuntimeException( $result->get_error_message() );\n}\n"
                }
              ]
            }
          description-template: |
            ### Test this PR in WordPress Playground

            {{PLAYGROUND_BUTTON}}

            **Branch:** `{{PR_HEAD_REF}}` · **Plugin:** `{{PLUGIN_SLUG}}`
          github-token: ${{ secrets.GITHUB_TOKEN }}
