name: Manual MOT-07 investigation
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mot07-load:
    name: Manual WebKit MOT-07
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        browser:
          - webkit
    env:
      CIM_PLAYER_BROWSER: webkit
      CIM_MOTION_DIAGNOSTICS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pinned release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
      - name: Identify exact WebKit browser cache
        id: webkit-cache-key
        if: matrix.browser == 'webkit'
        run: node tools/ci/webkit-install.mjs cache-key
      - name: Restore WebKit browser download
        id: webkit-browser-cache
        timeout-minutes: 5
        if: matrix.browser == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.webkit-cache-key.outputs.key }}
      - name: Identify exact WebKit package cache
        id: webkit-apt-key
        if: matrix.browser == 'webkit'
        run: node tools/ci/webkit-apt-key.mjs
      - name: Restore WebKit Ubuntu package archives
        id: webkit-apt-cache
        if: matrix.browser == 'webkit'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.webkit-apt-key.outputs.stage }}/*.deb
          key: ${{ steps.webkit-apt-key.outputs.key }}
      - name: Verify WebKit package-cache security tests
        id: webkit-apt-cache-tests
        if: matrix.browser == 'webkit'
        timeout-minutes: 1
        run: |
          /usr/bin/python3 -I tools/ci/tests/test_webkit_apt_cache.py
          /usr/bin/python3 -I tools/ci/tests/check_apt_cache_mutations.py
      - name: Bound WebKit APT connections and package retries
        id: webkit-apt-network
        if: matrix.browser == 'webkit'
        timeout-minutes: 1
        run: |
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/zzzz-cim-webkit-network > /dev/null
          sudo apt-config dump | grep -E '^Acquire::(http::Timeout|https::Timeout|Retries) '
          test "$(sudo apt-config shell VALUE Acquire::http::Timeout)" = "VALUE='30'"
          test "$(sudo apt-config shell VALUE Acquire::https::Timeout)" = "VALUE='30'"
          test "$(sudo apt-config shell VALUE Acquire::Retries)" = "VALUE='3'"
      - name: Authenticate restored WebKit archives and configure pre-install guard
        id: webkit-apt-cache-guard
        if: matrix.browser == 'webkit'
        timeout-minutes: 1
        env:
          CIM_APT_CACHE_HIT: ${{ steps.webkit-apt-cache.outputs.cache-hit }}
        run: sudo --preserve-env=RUNNER_TEMP,CIM_APT_CACHE_HIT /usr/bin/python3 -I tools/ci/webkit-apt-cache.py configure
      - name: Install WebKit Ubuntu dependencies (attempt 1 of 2)
        id: webkit-deps-first
        if: matrix.browser == 'webkit'
        timeout-minutes: 8
        continue-on-error: true
        run: sudo --preserve-env=RUNNER_TEMP "$(command -v node)" tools/ci/webkit-install.mjs deps 1
      - name: Retry WebKit Ubuntu dependencies (attempt 2 of 2)
        id: webkit-deps-retry
        if: ${{ !cancelled() && matrix.browser == 'webkit' && steps.webkit-deps-first.outcome == 'failure' }}
        timeout-minutes: 8
        run: |
          echo 'Retrying WebKit Ubuntu dependencies after the first APT attempt failed or timed out.'
          sudo --preserve-env=RUNNER_TEMP "$(command -v node)" tools/ci/webkit-install.mjs deps 2
      - name: Require current-job authenticated package-cache capture
        id: webkit-apt-proof
        if: matrix.browser == 'webkit'
        timeout-minutes: 1
        run: node tools/ci/webkit-apt-key.mjs proof
      - name: Save verified WebKit Ubuntu package archives after successful installation
        id: webkit-apt-cache-save
        if: ${{ !cancelled() && matrix.browser == 'webkit' && steps.webkit-apt-proof.outcome == 'success' && steps.webkit-apt-cache.outputs.cache-hit != 'true' && (steps.webkit-deps-first.outcome == 'success' || steps.webkit-deps-retry.outcome == 'success') }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.webkit-apt-key.outputs.stage }}/*.deb
          key: ${{ steps.webkit-apt-key.outputs.key }}
      - name: Download WebKit browser (attempt 1 of 2)
        id: webkit-browser-first
        if: matrix.browser == 'webkit' && steps.webkit-browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: node tools/ci/webkit-install.mjs browser 1
      - name: Retry WebKit browser download (attempt 2 of 2)
        id: webkit-browser-retry
        if: ${{ !cancelled() && matrix.browser == 'webkit' && steps.webkit-browser-cache.outputs.cache-hit != 'true' && steps.webkit-browser-first.outcome == 'failure' }}
        timeout-minutes: 5
        run: node tools/ci/webkit-install.mjs browser 2
      - name: Record WebKit browser cache hit
        id: webkit-cache-hit
        if: matrix.browser == 'webkit' && steps.webkit-browser-cache.outputs.cache-hit == 'true'
        run: node tools/ci/webkit-install.mjs cache-hit
      - name: Run only WebKit MOT-07 fixed repetitions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/mot07-report.json
        run: npx playwright test tests/e2e/motion-pane.spec.mjs --grep MOT-07 --repeat-each=20 --workers=4 --retries=0 --reporter=line,json
      - name: Summarize WebKit installation attempts
        id: webkit-install-summary
        if: ${{ always() && matrix.browser == 'webkit' }}
        run: node tools/ci/webkit-install.mjs summary
      - name: Retain all manual investigation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mot07-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            test-results/
            ${{ runner.temp }}/mot07-report.json
            ${{ runner.temp }}/cim-webkit-install/
          if-no-files-found: warn
