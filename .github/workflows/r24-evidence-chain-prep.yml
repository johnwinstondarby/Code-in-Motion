name: R24 evidence-chain prep

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cim-r24-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-lockfile:
    if: github.event.pull_request.head.ref == 'feat/wordpress-packaging-checkpoint-1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Generate R24 package and lockfile candidate
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'devDependencies.@wordpress/env=11.15.0'
          npm pkg set 'scripts.wp-env=wp-env'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update fast-uri --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Capture dependency and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/r24
          npm ls --all --json > .ci/r24/npm-ls.json
          npm ls @wordpress/env ajv fast-uri qs --all > .ci/r24/npm-focus.txt
          npm audit --json > .ci/r24/npm-audit.json || true
          npm audit > .ci/r24/npm-audit.txt 2>&1 || true
          node --version > .ci/r24/node-version.txt
          npm --version > .ci/r24/npm-version.txt

      - name: Upload R24 lockfile candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r24-lockfile-candidate
          path: |
            package.json
            package-lock.json
            .ci/r24/npm-ls.json
            .ci/r24/npm-focus.txt
            .ci/r24/npm-audit.json
            .ci/r24/npm-audit.txt
            .ci/r24/node-version.txt
            .ci/r24/npm-version.txt
          if-no-files-found: error
          retention-days: 7
