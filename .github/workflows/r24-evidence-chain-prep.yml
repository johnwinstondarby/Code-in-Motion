name: R24 release evidence

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cim-r24-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked evidence-chain dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/r24/toolchain
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee .ci/r24/toolchain/npm-ci.txt

      - name: Verify locked evidence-chain identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./node_modules/@wordpress/env/package.json').version")" = "11.15.0"
          test "$(node -p "require('./node_modules/ajv/package.json').version")" = "8.20.0"
          test "$(node -p "require('./node_modules/fast-uri/package.json').version")" = "3.1.8"
          git rev-parse HEAD > .ci/r24/candidate-commit.txt
          node --version > .ci/r24/toolchain/node-version.txt
          npm --version > .ci/r24/toolchain/npm-version.txt
          node -p "require('./node_modules/@wordpress/env/package.json').version" > .ci/r24/toolchain/wp-env-version.txt
          node -p "require('./node_modules/ajv/package.json').version" > .ci/r24/toolchain/ajv-version.txt
          node -p "require('./node_modules/fast-uri/package.json').version" > .ci/r24/toolchain/fast-uri-version.txt
          sha256sum package-lock.json > .ci/r24/toolchain/package-lock.sha256

      - name: Capture dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all --json > .ci/r24/toolchain/npm-ls.json
          npm ls @wordpress/env ajv fast-uri qs --all > .ci/r24/toolchain/npm-focus.txt

      - name: Capture non-blocking npm audit evidence
        shell: bash
        run: |
          set +e
          npm audit --json > .ci/r24/toolchain/npm-audit.json
          JSON_STATUS=$?
          npm audit > .ci/r24/toolchain/npm-audit.txt 2>&1
          TEXT_STATUS=$?
          set -e
          printf 'npm audit --json exit status: %s\n' "${JSON_STATUS}" > .ci/r24/toolchain/npm-audit-status.txt
          printf 'npm audit exit status: %s\n' "${TEXT_STATUS}" >> .ci/r24/toolchain/npm-audit-status.txt

      - name: Run complete verification suite
        shell: bash
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee .ci/r24/verify.txt

      - name: Build exact release artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run build:wordpress 2>&1 | tee .ci/r24/build.txt
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          ZIP="code-in-motion-${VERSION}.zip"
          (cd dist && sha256sum --check "${ZIP}.sha256")
          mkdir -p .ci/r24/artifact
          cp "dist/${ZIP}" ".ci/r24/artifact/${ZIP}"
          cp "dist/${ZIP}.sha256" ".ci/r24/artifact/${ZIP}.sha256"
          sha256sum "dist/${ZIP}" > .ci/r24/artifact/artifact.sha256
          find dist/code-in-motion -type f | wc -l | tr -d ' ' > .ci/r24/artifact/file-count.txt
          du -sb dist/code-in-motion | awk '{print $1}' > .ci/r24/artifact/staged-bytes.txt

      - name: Rebuild independent R23 manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          node tools/check-wordpress-supply-chain.mjs \
            --release-root dist/code-in-motion \
            --version "${VERSION}" \
            --write-manifest ".ci/r24/artifact/code-in-motion-${VERSION}.manifest.sha256"

      - name: Collect release QA evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/r24/evidence .ci/r24/toolchain
          cp wordpress/R16-UPGRADE-QA.md .ci/r24/evidence/
          cp wordpress/R17-POST-UPGRADE-QA.md .ci/r24/evidence/
          cp wordpress/R18-WORDPRESS-COMPATIBILITY.md .ci/r24/evidence/
          cp wordpress/R19-PHP-COMPATIBILITY.md .ci/r24/evidence/
          cp wordpress/R20-BROWSER-COMPATIBILITY.md .ci/r24/evidence/
          cp wordpress/R21-PLUGIN-CHECK.md .ci/r24/evidence/
          cp wordpress/R22-RELEASE-METADATA-QA.md .ci/r24/evidence/
          cp wordpress/R23-SUPPLY-CHAIN-QA.md .ci/r24/evidence/
          cp wordpress/R24-RELEASE-EVIDENCE.md .ci/r24/evidence/
          cp wordpress/RELEASE-QA.md .ci/r24/evidence/
          cp wordpress/RELEASE-TREE.md .ci/r24/evidence/
          cp package.json .ci/r24/toolchain/
          cp package-lock.json .ci/r24/toolchain/
          {
            echo "@octokit/webhooks-types@7.6.1 - npm deprecation warning; locked dev-tool dependency; excluded from the release artifact."
            echo "glob@10.5.0 - npm deprecation warning; locked dev-tool dependency; excluded from the release artifact."
          } > .ci/r24/toolchain/known-deprecation-warnings.txt

      - name: Write evidence index and bundle checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          ZIP="code-in-motion-${VERSION}.zip"
          ARTIFACT_SHA="$(sha256sum ".ci/r24/artifact/${ZIP}" | awk '{print $1}')"
          LOCK_SHA="$(sha256sum package-lock.json | awk '{print $1}')"
          FILE_COUNT="$(cat .ci/r24/artifact/file-count.txt)"
          {
            echo "Code in Motion R24 release evidence"
            echo "candidate_commit=$(git rev-parse HEAD)"
            echo "version=${VERSION}"
            echo "artifact=${ZIP}"
            echo "artifact_sha256=${ARTIFACT_SHA}"
            echo "artifact_file_count=${FILE_COUNT}"
            echo "package_lock_sha256=${LOCK_SHA}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "wp_env=$(node -p "require('./node_modules/@wordpress/env/package.json').version")"
            echo "ajv=$(node -p "require('./node_modules/ajv/package.json').version")"
            echo "fast_uri=$(node -p "require('./node_modules/fast-uri/package.json').version")"
            echo "github_run_id=${GITHUB_RUN_ID}"
          } > .ci/r24/EVIDENCE-INDEX.txt

          (
            cd .ci/r24
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload R24 release evidence package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r24-release-evidence
          path: .ci/r24
          if-no-files-found: error
          retention-days: 90
